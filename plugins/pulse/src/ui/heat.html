<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      pulse's day grid: the last 30 days as cells, one column per week (Monday on top), shaded by how
      many puts and archives fell on each day. Colours come only from frame.css's tokens, so the grid
      follows the UI's light and dark; the shades mix the chart colour into the surface.
    -->
    <link rel="stylesheet" href="/plugin-kit/frame.css" />
    <script src="/plugin-kit/frame.js"></script>
    <style>
      body { margin: 0; font-family: var(--font-sans); color: var(--ink); }
      .wrap { padding: 14px 16px; display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
      .grid { display: grid; grid-template-columns: auto; gap: 6px; }
      .months, .rows { display: grid; grid-auto-flow: column; gap: 4px; }
      .months { grid-auto-columns: 22px; margin-left: 30px; height: 14px; font-size: 11px; }
      .months span { white-space: nowrap; overflow: visible; }
      .body { display: flex; gap: 8px; }
      .wd { display: grid; grid-template-rows: repeat(7, 22px); gap: 4px; font-size: 11px; width: 22px; }
      .wd span { line-height: 22px; }
      .weeks { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 22px); grid-auto-columns: 22px; gap: 4px; }
      .cell { border-radius: 4px; background: var(--tray); box-shadow: inset 0 0 0 1px var(--line); outline: none; }
      .cell.out { background: transparent; box-shadow: none; }
      .cell.l1 { background: color-mix(in oklab, var(--chart) 24%, var(--surface)); box-shadow: none; }
      .cell.l2 { background: color-mix(in oklab, var(--chart) 48%, var(--surface)); box-shadow: none; }
      .cell.l3 { background: color-mix(in oklab, var(--chart) 72%, var(--surface)); box-shadow: none; }
      .cell.l4 { background: var(--chart); box-shadow: none; }
      .cell.today { box-shadow: 0 0 0 1.5px var(--ink-3); }
      .cell:not(.out):hover, .cell:not(.out):focus-visible { box-shadow: 0 0 0 2px var(--ink-2); }
      .legend { display: flex; align-items: center; gap: 4px; font-size: 11px; margin-left: 30px; }
      .legend .cell { width: 12px; height: 12px; border-radius: 3px; }
      .legend .cell:hover { box-shadow: none; }
      .facts { display: grid; gap: 10px; min-width: 140px; }
      .big { font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 32px; letter-spacing: -0.01em; color: var(--ink-strong); }
      .label { font-size: 12px; }
      .tip {
        position: fixed; pointer-events: none; padding: 4px 8px; border-radius: var(--radius-control);
        background: var(--tip-bg); color: var(--tip-ink); font-size: 12px; font-weight: 500; line-height: 16px; white-space: nowrap;
        box-shadow: 0 4px 12px -4px rgba(0, 0, 0, 0.24); display: none; z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="card wrap">
      <div class="grid" role="figure" aria-label="最近 30 天每天的放入和归档次数">
        <div class="months muted" id="months"></div>
        <div class="body">
          <div class="wd faint"><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span></div>
          <div class="weeks" id="weeks"></div>
        </div>
        <div class="legend faint">
          少<span class="cell"></span><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span>多
        </div>
      </div>
      <div class="facts">
        <div><div class="big" id="total">…</div><div class="label muted">最近 30 天的放入和归档</div></div>
        <div><div class="big" id="active">…</div><div class="label muted">有活动的天数</div></div>
        <div><div class="label" id="peak"></div></div>
      </div>
    </div>
    <div class="tip" id="tip"></div>
    <script>
      const $ = (id) => document.getElementById(id)
      const tip = $('tip')
      const label = (d) => `${Number(d.day.slice(5, 7))} 月 ${Number(d.day.slice(8))} 日：${d.count === 0 ? '没有活动' : `${d.count} 次`}`
      const level = (count, max) => (count === 0 ? 0 : Math.max(1, Math.ceil((4 * count) / max)))

      function showTip(cell, text) {
        tip.textContent = text
        tip.style.display = 'block'
        const r = cell.getBoundingClientRect()
        const w = tip.offsetWidth
        tip.style.left = `${Math.max(4, Math.min(window.innerWidth - w - 4, r.left + r.width / 2 - w / 2))}px`
        tip.style.top = `${r.top - tip.offsetHeight - 6 < 0 ? r.bottom + 6 : r.top - tip.offsetHeight - 6}px`
      }
      const hideTip = () => (tip.style.display = 'none')

      // data: { days: [{ day: 'YYYY-MM-DD', weekday: 0..6 (0 = Sunday), count }], oldest first; total }
      pneuma.onData((data) => {
        const days = data.days
        const max = Math.max(1, ...days.map((d) => d.count))
        // Monday-first row of each day; blank cells before the first day so it lands on its weekday.
        const row = (d) => (d.weekday + 6) % 7
        const lead = row(days[0])
        const cells = []
        for (let i = 0; i < lead; i++) {
          const blank = document.createElement('span')
          blank.className = 'cell out'
          cells.push(blank)
        }
        const months = []
        days.forEach((d, i) => {
          const col = Math.floor((lead + i) / 7)
          const month = d.day.slice(5, 7)
          if (i === 0 || d.day.endsWith('-01')) months.push({ col, text: `${Number(month)} 月` })
          const cell = document.createElement('span')
          cell.className = `cell${level(d.count, max) ? ` l${level(d.count, max)}` : ''}${i === days.length - 1 ? ' today' : ''}`
          cell.tabIndex = 0
          cell.setAttribute('role', 'img')
          cell.setAttribute('aria-label', label(d))
          cell.onmouseenter = cell.onfocus = () => showTip(cell, label(d))
          cell.onmouseleave = cell.onblur = hideTip
          cells.push(cell)
        })
        $('weeks').replaceChildren(...cells)
        const columns = Math.ceil((lead + days.length) / 7)
        // A month label only where it fits: drop the first if the next starts within two columns.
        const shown = months.filter((m, i) => !(i === 0 && months[1] && months[1].col - m.col < 2))
        $('months').replaceChildren(
          ...Array.from({ length: columns }, (_, col) => {
            const span = document.createElement('span')
            span.textContent = shown.find((m) => m.col === col)?.text ?? ''
            return span
          }),
        )
        $('total').textContent = String(data.total)
        $('active').textContent = String(days.filter((d) => d.count > 0).length)
        const peak = days.reduce((best, d) => (d.count > best.count ? d : best), days[0])
        $('peak').textContent = peak.count === 0 ? '还没有活动。' : `最忙的一天是 ${label(peak)}`
        $('peak').className = 'label muted'
      })
    </script>
  </body>
</html>
