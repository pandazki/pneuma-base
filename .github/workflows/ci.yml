name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # pnpm build compiles storage's program, core/ (tmp/run-7), which the kernel starts.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: Viewer E2E (Node 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      # pnpm build compiles storage's program, core/ (tmp/run-7), which the kernel starts.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: pnpm install --frozen-lockfile
      - name: Install Chrome and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          pnpm exec playwright install --with-deps chrome
      - run: pnpm test:e2e

  scaffold:
    # Generates a plugin project of each kind, installs it from the two package files and the
    # registry, builds it, runs its own tests, and installs it into a library. Needs the network.
    name: Plugin scaffold (Node 22.18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: pnpm
      # pnpm build compiles storage's program, core/ (tmp/run-7), which the kernel starts.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:slow
        timeout-minutes: 15
      # The package built here carries storage's programs built on Linux, for these tests only; the
      # product package and the app are built on an Apple-silicon Mac (PROVIDERS.md).
      - name: Plugins written outside the repository still pass
        run: pnpm pack:dist && sh scripts/test-example-plugins.sh
        timeout-minutes: 10
