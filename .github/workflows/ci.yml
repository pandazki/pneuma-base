# A change is checked by the tests of what it touches: the packages it changed, a few tests that
# cross the layers when it is below the command line, the browser tests when it changes what a
# person sees, the slow tests when it changes what a plugin author gets. Everything runs in the
# Full workflow, for a release.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: pnpm
      # pnpm build compiles storage's program, core/, which the kernel starts.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Tests of what changed
        id: affected
        run: node scripts/affected-tests.mjs --base "origin/${{ github.base_ref }}" --run --github
      - name: Install Chrome and CJK fonts
        if: steps.affected.outputs.e2e == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          pnpm exec playwright install --with-deps chrome
      - name: Browser tests
        if: steps.affected.outputs.e2e == 'true'
        run: pnpm test:e2e
      - name: Slow tests and the example plugins
        if: steps.affected.outputs.slow == 'true'
        run: pnpm test:slow && pnpm pack:dist && sh scripts/test-example-plugins.sh
        timeout-minutes: 25
